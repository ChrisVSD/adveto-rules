name: Auto-Update AdVeto Rules

on:
  schedule:
    - cron: '0 0 * * 0' # Εκτελείται αυτόματα κάθε Κυριακή τα μεσάνυχτα
  workflow_dispatch: # Σας επιτρέπει να το τρέχετε χειροκίνητα όποτε θέλετε

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Advanced Rules Generator
        run: |
          node -e '
          const fs = require("fs");

          async function fetchCleanDomains(url) {
            try {
              const response = await fetch(url);
              if (!response.ok) return [];
              const text = await response.text();
              const lines = text.split("\n");
              const domains = new Set();

              for (let line of lines) {
                line = line.trim();
                // Φιλτράρισμα: Κρατάμε μόνο τους απλούς κανόνες τύπου ||domain.com^
                if (line.startsWith("||") && line.endsWith("^")) {
                  let domain = line.substring(2, line.length - 1);
                  // Αφαίρεση τυχόν επιπλέον παραμέτρων
                  if (!domain.includes("/") && !domain.includes("*") && !domain.includes("@")) {
                    domains.add(domain);
                  }
                }
              }
              return Array.from(domains);
            } catch (e) {
              console.error("Error fetching sources:", e);
              return [];
            }
          }

          async function main() {
            console.log("Starting AdVeto Ultimate Rules Compilation...");
            
            // 1. Λήψη από τις δύο κορυφαίες επίσημες πηγές (EasyList + Greek Filter)
            const easylistDomains = await fetchCleanDomains("https://firebog.net");
            const greekDomains = await fetchCleanDomains("https://githubusercontent.com");
            
            // 2. Ενσωμάτωση των δικών σας βασικών κανόνων
            const initialDomains = [
              "doubleclick.net", 
              "googlesyndication.com", 
              "adnxs.com", 
              "://google.com", 
              "googletagservices.com"
            ];

            const allDomains = new Set([...initialDomains, ...easylistDomains, ...greekDomains]);
            const baseRules = [];
            let currentId = 1;

            for (const domain of allDomains) {
              if (!domain) continue;
              
              baseRules.push({
                id: currentId++,
                priority: 1,
                action: { type: "block" },
                condition: { 
                  urlFilter: domain, 
                  resourceTypes: ["script", "image", "sub_frame", "xmlhttprequest"] 
                }
              });

              // Όριο ασφαλείας για μέγιστη ταχύτητα στον browser του χρήστη
              if (currentId > 15000) break;
            }

            fs.writeFileSync("rules.json", JSON.stringify(baseRules, null, 2));
            console.log(`Ultimate rules.json successfully created with ${baseRules.length} active rules!`);
          }

          main();
          '

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update ultimate adblock rules [automated]"
          file_pattern: "rules.json"
