name: Auto-Update AdVeto Rules

on:
  schedule:
    - cron: '0 0 * * *' # Τρέχει αυτόματα κάθε βράδυ στις 00:00
  workflow_dispatch: # Σου επιτρέπει να το τρέχεις και χειροκίνητα

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ultimate Rules Generator
        run: |
          node -e '
          const fs = require("fs");

          async function fetchDomains(url) {
            try {
              console.log("Fetching from: " + url);
              const response = await fetch(url);
              if (!response.ok) return [];
              const text = await response.text();
              const lines = text.split("\n");
              const domains = new Set();

              for (let line of lines) {
                line = line.trim();
                // Αγνοούμε σχόλια και κενές γραμμές
                if (!line || line.startsWith("#") || line.startsWith("!") || line.startsWith("//")) continue;
                
                // Καθαρισμός γραμμών τύπου hosts (0.0.0.0 domain.com)
                const parts = line.split(/\s+/);
                let domain = parts.length > 1 ? parts[1] : parts[0];
                
                // Αφαίρεση adblock syntax αν υπάρχει (π.χ. ||domain.com^)
                domain = domain.replace(/^\|\|/, "").replace(/\^$/, "");

                if (domain && domain.includes(".") && !domain.includes("/")) {
                  domains.add(domain.toLowerCase());
                }
              }
              return Array.from(domains);
            } catch (e) {
              console.error("Error:", e);
              return [];
            }
          }

          async function main() {
            // Οι καλύτερες πηγές παγκοσμίως
            const sources = [
              "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts", // Ads + Malware
              "https://raw.githubusercontent.com/easylist/easylist/master/easylist/easylist_adservers.txt", // EasyList
              "https://raw.githubusercontent.com/hl2guide/Filter-Lists/master/Greek-AdBlock-Hosts.txt" // Greek Ads
            ];

            let allDomains = new Set();
            for (const url of sources) {
              const domains = await fetchDomains(url);
              domains.forEach(d => allDomains.add(d));
            }

            const rules = [];
            let id = 1;
            // Μετατροπή σε μορφή Chrome Declarative Net Request
            for (const domain of allDomains) {
              rules.push({
                id: id++,
                priority: 1,
                action: { type: "block" },
                condition: { 
                  urlFilter: domain, 
                  resourceTypes: ["script", "image", "sub_frame", "xmlhttprequest"] 
                }
              });
              if (id > 20000) break; // Όριο 20.000 κανόνων για μέγιστη ταχύτητα
            }

            fs.writeFileSync("rules.json", JSON.stringify(rules, null, 2));
            console.log("Done! Created " + rules.length + " rules.");
          }
          main();
          '

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "System: Ultimate rules auto-update"
          file_pattern: "rules.json"
