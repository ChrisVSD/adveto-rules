name: Update Vetoly rules

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2 # 1. Ενημέρωση στην τρέχουσα ασφαλή έκδοση

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0 # 2. Ενημέρωση στην τρέχουσα έκδοση
        with:
          node-version: 24 # 3. Αλλαγή από 20 σε 24

      - name: Build rules
        run: node tools/build-rules.mjs

      - name: Validate generated rules
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const rules = JSON.parse(fs.readFileSync("rules.json"));
            const extra = JSON.parse(fs.readFileSync("rules-extra.json"));
            const cosmetic = JSON.parse(fs.readFileSync("cosmetic-rules.json"));
            if (!rules.length || rules.length > 30000) throw new Error("Invalid network rule count");
            if (extra.length > 30000) throw new Error("Invalid extended rule count");
            if (!cosmetic.length || cosmetic.length > 50000) throw new Error("Invalid cosmetic rule count");
            const ids = new Set(rules.map(rule => rule.id));
            if (ids.size !== rules.length) throw new Error("Duplicate network rule IDs");
            for (const rule of rules) {
              if (!rule.action?.type || (!rule.condition?.urlFilter && !rule.condition?.regexFilter)) {
                throw new Error(`Invalid rule ${rule.id}`);
              }
            }
            console.log(`Validated ${rules.length} network and ${cosmetic.length} cosmetic rules`);
          '

      - name: Commit updated rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add rules.json rules-extra.json cosmetic-rules.json rules-meta.json
          if git diff --cached --quiet; then
            echo "No rule changes"
          else
            git commit -m "chore: update generated rules"
            git push
          fi
